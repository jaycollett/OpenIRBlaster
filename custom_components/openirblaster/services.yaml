# OpenIRBlaster Services
# Names, descriptions, and field labels come from translations
# (strings.json / translations/en.json).

learn_start:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: openirblaster
    timeout:
      required: false
      default: 30
      example: 30
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: seconds

send_code:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: openirblaster
    id:
      required: true
      example: "tv_power"
      selector:
        text:
    carrier_hz:
      required: false
      example: 38000
      selector:
        number:
          min: 30000
          max: 56000
          unit_of_measurement: Hz
    pulses:
      required: false
      example: [9000, 4500, 560]
      selector:
        object:

delete_code:
  fields:
    id:
      required: true
      example: "tv_power"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: openirblaster

rename_code:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: openirblaster
    id:
      required: true
      example: "tv_power"
      selector:
        text:
    new_name:
      required: true
      example: "TV Power Button"
      selector:
        text:

save_pending:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: openirblaster
    name:
      required: true
      example: "TV Power"
      selector:
        text:
    tags:
      required: false
      example: "tv, living-room, power"
      selector:
        text:
    notes:
      required: false
      example: "Samsung TV power button"
      selector:
        text:
