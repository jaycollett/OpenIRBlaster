substitutions:
  name: openirblaster
  friendly_name: OpenIRBlaster
  ap_ssid: "OpenIRBlaster Setup"
  default_carrier_hz: "38000"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # name_add_mac_suffix ensures each device has a unique name (e.g., "openirblaster-64c999")
  name_add_mac_suffix: true
  project:
    name: "jaycollett.openirblaster"
    version: "0.5.0"

# Allows ESPHome Device Builder to discover and adopt this device for customization
dashboard_import:
  package_import_url: github://jaycollett/OpenIRBlaster/hardware/firmware/factory_flash.yaml@master
  import_full_config: true

esp8266:
  board: esp12e

logger:
  level: INFO

api:
  reboot_timeout: 5min
  services:
    - service: send_ir_raw
      variables:
        carrier_hz: int
        code: int[]
      then:
        - logger.log:
            format: "Received send_ir_raw service call: carrier_hz=%d, code_length=%d"
            level: INFO
            args:
              - "carrier_hz"
              - "code.size()"
        - remote_transmitter.transmit_raw:
            transmitter_id: ir_tx
            carrier_frequency: !lambda "return (float)carrier_hz;"
            code: !lambda "return code;"
        - logger.log:
            format: "IR transmission complete"
            level: INFO

    # Re-fire the last learned IR event from cached globals. The HA
    # integration calls this when the capture marker changes but the
    # corresponding learned event did not arrive, which means the original
    # event was lost on a transient API socket drop. Replay re-emits the
    # event with identical data so the integration can finalize the
    # capture without forcing the user to re-press the remote.
    - service: replay_last_ir
      then:
        - if:
            condition:
              lambda: "return !id(last_pulses_json).empty();"
            then:
              - logger.log:
                  format: "Replaying last learned IR event"
                  level: INFO
              - homeassistant.event:
                  event: esphome.openirblaster_learned
                  data:
                    device_id: !lambda "return App.get_name();"
                    # Reads the MAC from the wifi_info text_sensor's stable
                    # .state member. If the sensor hasn't published yet (cold
                    # boot before WiFi associates) this returns an empty
                    # string, which the HA integration treats as "no MAC
                    # supplied" and falls through to device_id matching.
                    # Do NOT revert to WiFi.macAddress().c_str() here: that
                    # is the dangling-pointer bug that the on_raw lambda
                    # comment in this file documents.
                    mac_address: !lambda "return id(text_sensor_mac_address).state;"
                    carrier_hz: !lambda "return id(last_carrier_hz);"
                    pulses_json: !lambda "return id(last_pulses_json);"
                    timestamp: !lambda "return id(last_timestamp);"
                    rssi: !lambda "return id(last_rssi);"
            else:
              - logger.log:
                  format: "replay_last_ir called but no capture is cached"
                  level: WARN

ota:
  - platform: esphome

wifi:
  min_auth_mode: WPA2
  # Helps stability / reduces peak demand a bit on ESP8266
  output_power: 8.5dB
  ap:
    ssid: ${ap_ssid}
    # open fallback AP (no password)
    ap_timeout: 0s

captive_portal:

# For ISO-ish timestamps in the learned event payload
time:
  - platform: sntp
    id: ha_time
    timezone: UTC

globals:
  - id: learn_enabled
    type: bool
    restore_value: no
    initial_value: "false"

  # Last captured IR data. Populated by the on_raw handler when a code is
  # learned, and read by the replay_last_ir service. Not restored across
  # reboots; a reboot is the user's signal that any cached capture is gone
  # and the remote should be pressed fresh.
  - id: last_pulses_json
    type: std::string
    restore_value: no
  - id: last_carrier_hz
    type: int
    restore_value: no
    initial_value: "0"
  - id: last_timestamp
    type: std::string
    restore_value: no
  - id: last_rssi
    type: int
    restore_value: no
    initial_value: "0"

sensor:
  - platform: uptime
    name: "Uptime"

  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi Signal"
    update_interval: 30s

switch:
  - platform: restart
    name: "Restart"

  # Required by HA integration spec: controls whether device emits learned notifications
  - platform: template
    name: "IR Learning Mode"
    id: ir_learning_mode
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - logger.log:
          format: "IR Learning Mode ENABLED"
          level: INFO
      - lambda: "id(learn_enabled) = true;"
    turn_off_action:
      - logger.log:
          format: "IR Learning Mode DISABLED"
          level: INFO
      - lambda: "id(learn_enabled) = false;"

button:
  - platform: template
    name: "Clear Last Learned IR"
    on_press:
      - text_sensor.template.publish:
          id: last_ir_capture_marker
          state: ""
      - lambda: |-
          id(last_pulses_json) = std::string("");
          id(last_timestamp) = std::string("");
          id(last_carrier_hz) = 0;
          id(last_rssi) = 0;

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    mac_address:
      name: "MAC Address"
      id: text_sensor_mac_address

  # Capture marker. Set to the timestamp of the most recent learned capture.
  # Stays well under HA core's 255-char state-length limit so the state
  # change survives the bus. The HA integration listens for changes and
  # uses them as a signal to call replay_last_ir if the corresponding
  # learned event did not arrive (e.g., transient API socket drop).
  - platform: template
    name: "Last IR Capture Marker"
    id: last_ir_capture_marker
    update_interval: never

# IR Receiver (TSOP38238) on GPIO5
# NOTE: Hardware schematic shows GPIO4/GPIO5 are swapped in the ESP-12F footprint
# The TSOP38238 OUT pin connects to GPIO5, not GPIO4
remote_receiver:
  id: ir_rx
  pin:
    number: GPIO5
    mode: INPUT_PULLUP
    inverted: true

  # ESP8266-safe: avoid dump: all (can contribute to RAM pressure)
  dump: raw

  # Stable value from prior testing
  buffer_size: 6kb

  tolerance: 50%
  filter: 50us
  idle: 25ms

  on_raw:
    then:
      - if:
          condition:
            lambda: "return id(learn_enabled);"
          then:
            - logger.log:
                format: "IR code received during learning mode (pulse count: %d)"
                level: INFO
                args:
                  - "x.size()"

            # Build the capture into globals so both the initial event and
            # the replay_last_ir service emit identical data.
            - lambda: |-
                const size_t MAX_PULSES = 600;
                size_t n = x.size();
                if (n > MAX_PULSES) n = MAX_PULSES;

                std::string s;
                s.reserve(8 * n + 2);
                s += "[";
                for (size_t i = 0; i < n; i++) {
                  s += to_string((int) x[i]);
                  if (i + 1 < n) s += ",";
                }
                s += "]";
                id(last_pulses_json) = s;

                id(last_carrier_hz) = (int) atoi("${default_carrier_hz}");

                auto now = id(ha_time).now();
                if (now.is_valid()) {
                  id(last_timestamp) = now.strftime("%Y-%m-%dT%H:%M:%S%z");
                } else {
                  id(last_timestamp) = std::string("");
                }

                if (isnan(id(wifi_rssi).state)) {
                  id(last_rssi) = 0;
                } else {
                  id(last_rssi) = (int) id(wifi_rssi).state;
                }

            # Primary delivery path: fire the learned event using the cached
            # globals. Lambdas read from globals (stable std::string members
            # and ints), so no dangling-pointer hazards.
            - homeassistant.event:
                event: esphome.openirblaster_learned
                data:
                  device_id: !lambda "return App.get_name();"
                  mac_address: !lambda "return id(text_sensor_mac_address).state;"
                  carrier_hz: !lambda "return id(last_carrier_hz);"
                  pulses_json: !lambda "return id(last_pulses_json);"
                  timestamp: !lambda "return id(last_timestamp);"
                  rssi: !lambda "return id(last_rssi);"

            # Fallback signal: publish a small marker the HA integration can
            # observe. State replays on API reconnect, so if the event above
            # was lost on a transient socket drop the integration can ask
            # the device to replay it via the replay_last_ir service.
            - text_sensor.template.publish:
                id: last_ir_capture_marker
                state: !lambda "return id(last_timestamp);"

            - switch.turn_off: ir_learning_mode

# IR Transmitter on GPIO14 (driving the IRLML6344 gate)
remote_transmitter:
  id: ir_tx
  pin: GPIO14
  carrier_duty_percent: 50%
